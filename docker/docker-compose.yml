# TCG Automation Docker Compose
# Usage: docker compose up -d
#
# Services:
#   - frontend: React web UI (port 3000)
#   - backend: FastAPI REST API (port 8000)
#   - tcg-cli: CLI tool for automation tasks

services:
  # ==========================================================
  # Frontend - React Web UI
  # ==========================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: tcg-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================
  # Backend - FastAPI REST API
  # ==========================================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: tcg-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ODOO_URL=${ODOO_URL:-http://192.168.10.105:8069}
      - ODOO_DB=${ODOO_DB:-TCG-Cards}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - DEBUG=${DEBUG:-false}
      # Authentication (REQUIRED)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Email notifications (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      # Printer settings
      - PRINTER_ENABLED=${PRINTER_ENABLED:-false}
      - PRINTER_IP=${PRINTER_IP:-}
      - PRINTER_PORT=${PRINTER_PORT:-9100}
      - PRINTER_MODEL=${PRINTER_MODEL:-QL-800}
      - PRINTER_LABEL_SIZE=${PRINTER_LABEL_SIZE:-29x90}
    volumes:
      - auth-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================
  # CLI Tool - For automation tasks
  # ==========================================================
  tcg-cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tcg-cli
    profiles:
      - cli  # Only starts with: docker compose --profile cli run tcg-cli
    environment:
      - ODOO_URL=${ODOO_URL:-http://192.168.10.105:8069}
      - ODOO_DB=${ODOO_DB:-TCG-Cards}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    # Override default command
    entrypoint: ["tcg"]

  # ==========================================================
  # Price Sync - Cron job for syncing prices
  # ==========================================================
  price-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tcg-price-sync
    profiles:
      - cron  # Only starts with: docker compose --profile cron up price-sync
    restart: "no"
    environment:
      - ODOO_URL=${ODOO_URL:-http://192.168.10.105:8069}
      - ODOO_DB=${ODOO_DB:-TCG-Cards}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    command: ["sync"]

networks:
  default:
    name: tcg-network

volumes:
  # Persistent data volumes
  auth-data:  # SQLite auth database
  tcg-data:
