# TCG Automation Docker Compose
# Usage: docker compose up -d

version: "3.8"

services:
  # Card Scanner Web Server
  tcg-scanner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tcg-scanner
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ODOO_URL=${ODOO_URL:-http://192.168.10.105:8069}
      - ODOO_DB=${ODOO_DB:-TCG-Cards}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
    command: ["server", "--no-debug"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Price Sync Cron Job (runs daily at 6 AM)
  tcg-price-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tcg-price-sync
    restart: "no"
    environment:
      - ODOO_URL=${ODOO_URL:-http://192.168.10.105:8069}
      - ODOO_DB=${ODOO_DB:-TCG-Cards}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    command: ["sync"]
    # Use with external scheduler (cron, systemd timer, etc.)
    # Or use: docker compose run --rm tcg-price-sync

networks:
  default:
    name: tcg-network


