name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # ==========================================================
  # Python Dependency Scanning
  # ==========================================================
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety bandit
          # Install only production dependencies for security scanning
          cd backend && pip install -e . && cd ..
      
      - name: Run pip-audit (SBOM-based vulnerability scan)
        run: |
          cd backend
          pip-audit --desc --format json --output ../reports/pip-audit.json || true
          pip-audit --desc || true
        continue-on-error: true
      
      - name: Run Safety (dependency vulnerability check)
        run: |
          cd backend
          safety check --json --output ../reports/safety.json || true
          safety check || true
        continue-on-error: true
      
      - name: Run Bandit (Python code security scan)
        run: |
          cd backend
          bandit -r app/ -f json -o ../reports/bandit.json || true
          bandit -r app/ -ll || true
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-reports
          path: reports/
          retention-days: 30

  # ==========================================================
  # JavaScript Dependency Scanning
  # ==========================================================
  javascript-security:
    name: JavaScript Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run npm audit
        run: |
          cd frontend
          mkdir -p ../reports
          npm audit --json > ../reports/npm-audit.json || true
          npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-security-reports
          path: reports/
          retention-days: 30

  # ==========================================================
  # Container Scanning with Trivy
  # ==========================================================
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: |
          docker build -f docker/Dockerfile.backend -t tcg-backend:test .
      
      - name: Build frontend image
        run: |
          docker build -f docker/Dockerfile.frontend -t tcg-frontend:test .
      
      - name: Run Trivy vulnerability scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tcg-backend:test'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Run Trivy vulnerability scanner on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tcg-frontend:test'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: '.'

  # ==========================================================
  # Secret Scanning
  # ==========================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for complete scan
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # ==========================================================
  # OWASP Dependency Check
  # ==========================================================
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Odoo_TCG'
          path: '.'
          format: 'HTML'
          out: 'reports'
        continue-on-error: true
      
      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 30
