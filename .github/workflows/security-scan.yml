name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # ==========================================================
  # Python Dependency Scanning
  # ==========================================================
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
          # Install only production dependencies for security scanning
          cd backend && pip install -e . && cd ..

      - name: Run pip-audit (SBOM-based vulnerability scan)
        run: |
          pip-audit --desc --format json --output reports/pip-audit.json 2>&1 || true
          pip-audit --desc 2>&1 || true
        continue-on-error: true

      - name: Run Bandit (Python code security scan)
        run: |
          bandit -r backend/app/ -f json -o reports/bandit.json 2>&1 || true
          bandit -r backend/app/ -ll 2>&1 || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================================
  # JavaScript Dependency Scanning
  # ==========================================================
  javascript-security:
    name: JavaScript Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --json > ../reports/npm-audit.json 2>&1 || true
          npm audit --audit-level=moderate 2>&1 || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================================
  # Container Scanning with Trivy
  # ==========================================================
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    # Only run on main branch pushes (not PRs) to avoid long build times
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Build backend image
        run: |
          docker build -f docker/Dockerfile.backend -t tcg-backend:test . || true
        continue-on-error: true

      - name: Build frontend image
        run: |
          docker build -f docker/Dockerfile.frontend -t tcg-frontend:test . || true
        continue-on-error: true

      - name: Run Trivy vulnerability scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tcg-backend:test'
          format: 'table'
          output: 'reports/trivy-backend.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tcg-frontend:test'
          format: 'table'
          output: 'reports/trivy-frontend.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================================
  # Secret Scanning (simplified - GitHub has built-in secret scanning)
  # ==========================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for complete scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
        continue-on-error: true

  # ==========================================================
  # OWASP Dependency Check (run only on schedule, not PRs)
  # ==========================================================
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    # Only run on schedule or main branch (slow job)
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Odoo_TCG'
          path: '.'
          format: 'HTML'
          out: 'reports'
        continue-on-error: true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
