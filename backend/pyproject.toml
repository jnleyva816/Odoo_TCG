[project]
name = "tcg-backend"
version = "2.0.0"
description = "FastAPI backend for TCG Inventory Management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.6",
    "reportlab>=4.0.0",
    "qrcode[pil]>=7.4.0",
    "pillow>=10.0.0",
    "brother-ql>=0.9.4",
    "python-barcode>=0.15.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5.0.0",
    "aiosqlite>=0.19.0",
    "email-validator>=2.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Background tasks
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    # PostgreSQL async driver for price history
    "asyncpg>=0.29.0",
    # Card Scanner (ML-based detection + identification)
    "onnxruntime>=1.16.0",
    "imagehash>=4.3.1",
    "opencv-python-headless>=4.8.0",
    # SOTA vector search for card matching
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.auth.odoo_auth"
ignore_errors = true
