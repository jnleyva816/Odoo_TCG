[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcg-automation"
version = "1.0.0"
description = "Pokemon TCG automation for Odoo ERP - import cards, sync prices, generate labels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Josh Leyva", email = "joshleyva816@gmail.com" }
]
keywords = ["pokemon", "tcg", "odoo", "automation", "inventory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "reportlab>=4.0.0",
    "python-barcode>=0.15.1",
    "qrcode>=7.4.2",
    "Pillow>=10.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
tcg = "tcg_automation.cli:main"

[project.urls]
Homepage = "https://github.com/jleyva816/tcg-automation"
Repository = "https://github.com/jleyva816/tcg-automation"
Issues = "https://github.com/jleyva816/tcg-automation/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_automation"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true


